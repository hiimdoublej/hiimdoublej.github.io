name: Build and deploy site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.170.0'

      - name: Build and verify site
        shell: bash
        run: |
          output="$(mktemp -d)"
          hugo --minify --destination "$output"
          for page in index.html about/index.html posts/{how-i-learned-to-code,okr-feelings,pms}/index.html index.xml js/feather.min.js; do
            test -s "$output/$page"
          done
          grep -Fq 'Hugo 0.170.0' "$output/index.html"
          cmp static/ads.txt "$output/ads.txt"
          cmp static/CNAME "$output/CNAME"
          test ! -e "$output/posts/my-first-post"
          echo "SITE_DIR=$output" >> "$GITHUB_ENV"

      - name: Upload verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Publish verified site
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
